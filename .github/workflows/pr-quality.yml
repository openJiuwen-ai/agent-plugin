name: PR Quality Check

# PR 质量门禁：结构检查 + L0/L1 校验 + catalog 一致性 + 密钥扫描 + 单元测试。
# 本地等价命令：python scripts/pr_check.py
# 可观测与评估插件有独立的运行时和宿主作业；全仓 L2 hot-load 仍按仓库变量开关。

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  quality-gate:
    name: Quality Gate (L0/L1 + catalog + secrets + tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependency
        run: python -m pip install pytest

      - name: PR quality check
        run: python scripts/pr_check.py

  observability-evaluation:
    name: Observability and Evaluation (runtime + standalone)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install plugin core and build/test dependencies
        run: |
          python -m pip install uv
          uv pip install --system pytest build 'hatchling>=1.27,<2' \
            -r plugins/observability-and-evaluation/requirements.txt
          uv pip check --system

      - name: Runtime, read-only ZIP, and standalone installation tests
        run: >-
          python -m pytest tests/plugins/observability-and-evaluation
          --require-ojw-runtime -ra

      - name: Build standalone wheel and source archive
        run: python -m build --outdir dist/standalone packaging/observability-and-evaluation

  observability-evaluation-host:
    name: Observability and Evaluation (JiuwenSwarm host)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tested host dependencies
        run: |
          python -m pip install uv
          uv pip install --system 'workswarm==0.2.7' \
            -r plugins/observability-and-evaluation/requirements.txt
          uv pip check --system

      - name: Validate, build, and exercise the extracted plugin
        run: |
          python scripts/validate.py --only observability-and-evaluation --require-hot-load
          python packaging/observability-and-evaluation/build_plugin.py --zip
          python -m zipfile -e dist/observability-and-evaluation-*.zip dist/extracted
          python -I -B tests/plugins/observability-and-evaluation/packaged_smoke.py \
            dist/extracted/observability-and-evaluation "$RUNNER_TEMP/ojw-smoke" \
            --host-envelope --interaction --move-workspace

  hot-load:
    # L2 热加载（真实 import openjiuwen 并实例化 tool/rail）。
    # openjiuwen 运行时进入 CI 的通道确定后，把仓库变量 ENABLE_HOT_LOAD 置 true
    # 启用本作业（Settings -> Secrets and variables -> Actions -> Variables）。
    if: ${{ vars.ENABLE_HOT_LOAD == 'true' }}
    name: L2 Hot Load
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install openjiuwen runtime
        run: |
          # TODO: openjiuwen 尚未发布到公开源；临时方案见 docs/hub-publish.md
          # （使用 jiuwenswarm 主仓 .venv / 私有 wheel 源）。
          pip install openjiuwen

      - name: L2 hot-load validation
        run: python scripts/validate.py --require-hot-load
